name: Build Clipboard

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 编译 Apple Silicon 版本
        run: |
          xcodebuild \
            -project Clipboard.xcodeproj \
            -scheme Clipboard \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包自用测试版
        run: |
          APP="build/Build/Products/Release/Clipboard.app"
          cp build/Build/Products/Release/clipmcp "$APP/Contents/MacOS/"
          cp LICENSE "$APP/Contents/Resources/LICENSE"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" Clipboard-arm64.zip

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard-arm64
          path: Clipboard-arm64.zip
          retention-days: 7
          if-no-files-found: error
